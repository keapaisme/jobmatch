name: JobMatch Automated Monitor

on:
  schedule:
    # 每 6 小時自動執行一次，UTC 0/6/12/18 點整 (台灣時間 8/14/20/2 點) (可依需求自行修改)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # 支援在 GitHub Actions UI 介面上手動點擊按鈕觸發執行

jobs:
  run-monitor-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run JobMatch Monitor Task
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python3 main.py

      - name: 💾 Commit & Push state files (seen_urls & db)
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "auto: update seen_urls and keyword states [skip ci]"
          file_pattern: "seen_urls.txt keywords_state.json storage/opportunities.db storage/dashboard_data.json"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: 🌐 Deploy Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
          keep_files: true
