keywords:
  ai_planning:
    exclude:
    - 全職
    - 長期小編
    include:
    - AI
    - ChatGPT
    - 簡報
    - PPT
    - 排版
    - 美化
    - 企劃
    - Notion
    - 短影音
    - 提案
    - 教學
    - 教會
    - AI課程
    - 教人
    - 使用教學
    - AI工具
    - 生成式AI
    - Midjourney
    - Stable Diffusion
    - Claude
    - Gemini
    - 自動化流程
    - n8n
    - Zapier
  data_automation:
    exclude:
    - 全職
    - 打卡
    - 派遣
    - 正職
    include:
    - 爬蟲
    - 抓資料
    - 轉檔
    - 整理資料
    - VBA
    - Excel
    - 建檔
    - 資料處理
    - API
    - 自動化
  japanese_niche:
    exclude:
    - 英文
    - 韓文
    - 全職
    - 補習班
    - 家教
    - 老師
    - 一般翻譯
    include:
    - 日文急件
    - 日本代打
    - 代聯絡
    - 日文 商務
    - 日翻中 急
    - 特急
min_hourly_wage: 350
targets:
  dcard:
    fetch_interval_hours: 2
    forums:
    - job
    - part_time_job
    - money
  job104:
    fetch_interval_hours: 2
    keywords:
    - 論件計酬
    - 遠端 整理
    - 外包 爬蟲
    - 排版
    - 專案 外包
  ptt:
    boards:
    - SOHO
    - translator
    - CodeJob
    - HelpBuy
    - Soft_Job
    fetch_interval_hours: 2
  tasker:
    enabled: true
    fetch_interval_hours: 2
  xiao_ji:
    categories:
    - 電腦
    - 多媒體
    - 文書處理
    - 課業
    fetch_interval_hours: 2
telegram:
  bot_token: <YOUR_TELEGRAM_BOT_TOKEN>
  chat_id: <YOUR_TELEGRAM_CHAT_ID>
